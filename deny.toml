[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2021-0153", reason = "encoding is used by dicom-encoding (dicom-rs); no maintained replacement upstream yet" },
    { id = "RUSTSEC-2024-0436", reason = "paste is used by rav1e (image, via dicom-pixeldata); proc-macro only" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# licenses needed by a single crate only
exceptions = [
    { allow = [
        "IJG",
    ], crate = "jpeg-encoder" },
    { allow = [
        "NCSA",
    ], crate = "libfuzzer-sys" },
]

confidence-threshold = 0.93

[bans]
# duplicates come from ecosystem-wide version splits (e.g. syn 2/3, digest 0.10/0.11) between dependencies
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
