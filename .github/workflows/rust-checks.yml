name: rust-checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-rust-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # required by upload-sarif
      actions: read
      security-events: write
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:4.51
        ports:
          - 8333:8333
        options: >-
          --health-cmd "curl -fsS -o /dev/null http://127.0.0.1:8333/healthz || exit 1"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: clippy,rustfmt
          override: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo install clippy-sarif sarif-fmt
      - name: Print versions
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: cargo check (default features)
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-features

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --message-format=json | clippy-sarif | tee results.sarif | sarif-fmt

      # Workaround for a bug in clippy-sarif causing it to generate duplicated relatedLocations
      - name: Deduplicate SARIF relatedLocations
        run: |
          jq '(.runs[].results[].relatedLocations) |= unique' results.sarif > results-dedup.sarif
          mv results-dedup.sarif results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
