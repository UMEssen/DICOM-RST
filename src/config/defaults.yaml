telemetry:
  # sentry: $SENTRY_DSN
  level: INFO
server:
  aet: DICOM-RST
  http:
    interface: 0.0.0.0
    port: 8080
    max-upload-size: 5000000000
    max-part-size: 50000000
    request-timeout: 60000
    graceful-shutdown: true
    base-path: /
  dimse:
    - aet: DICOM-RST
      interface: 0.0.0.0
      port: 7001
      uncompressed: true
  stgcmt:
    ttl: 86400000
    max-transactions: 10000
aets:
  - aet: ORTHANC
    host: 127.0.0.1
    port: 4242
    backend: DIMSE
    pool:
      size: 16
      timeout: 10000
    qido-rs:
      timeout: 10000
    stow-rs:
      timeout: 10000
    wado-rs:
      timeout: 30000
      mode: concurrent
      receivers:
        - DICOM-RST # see server.dimse